name: Publish CopperFS reference site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copperfs-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and verify public evidence at this revision
        run: python3 build/pages.py publish
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reference site
        id: deployment
        uses: actions/deploy-pages@v4
