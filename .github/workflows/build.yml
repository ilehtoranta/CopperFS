name: Build and test

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: CopperSFS
      - uses: actions/checkout@v4
        with:
          repository: ilehtoranta/CopperSharp68k
          path: CopperSharp68k
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test SFS core and retain reliability evidence
        shell: pwsh
        run: ./CopperSFS/scripts/Test-Reliability.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/CopperSFS/artifacts/reliability/ci"
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-evidence
          path: CopperSFS/artifacts/reliability/ci/
          if-no-files-found: warn
