name: Build and test

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: CopperFS
      - uses: actions/checkout@v4
        with:
          repository: ilehtoranta/CopperSharp68k
          # .NET 10 compiler revision used for the SFS2 benchmark validation.
          ref: f07e8ec99de4ddbdfad74cc2dbb4a9343e1e55b7
          path: CopperSharp68k
      - uses: actions/checkout@v4
        with:
          repository: ilehtoranta/CopperScreen
          # Provides the emulator and CopperDisk projects used by integration tests.
          # 9a34172 adds opt-in multi-range UNMAP (MaximumDiscardDescriptors).
          ref: 9a341723320c3ce3c1427a49a8afccc06fe8789a
          path: CopperScreen
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test OFS, FFS, SFS and SFS2 cores
        run: dotnet test CopperFS/CopperFS.slnx -c Release
      - name: Test the shared SFS pool home-write fallback
        run: dotnet test CopperFS/tests/CopperSFS.Core.Tests/CopperSFS.Core.Tests.csproj -c Release -p:CopperFsSfsPool=true --filter FullyQualifiedName~SharedPoolHomeWriteFailureUpdatesCaller
